[project]
name = "all-seeing-eye"
version = "0.1.0"
description = "24/7 two-layer (BRAIN + REFLEX) crypto trading system with code-owned risk limits, ccxt testnet/paper execution, walk-forward backtesting, and nightly calibration review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4,<5",
    "google-genai>=1.0,<2",
    "httpx>=0.28,<1",
    "numpy>=2.0,<3",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
]

[project.scripts]
ase = "ase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
