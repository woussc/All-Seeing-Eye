[project]
name = "all-seeing-eye-market"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "exchange-calendars>=4.11,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
