name: Publish Market Rotation Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: market-rotation-pages
  cancel-in-progress: false

jobs:
  build:
    # Public repositories use free standard GitHub-hosted runners. Never change
    # repository visibility automatically or consume a private-repo allowance.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install uv==0.12.23
          uv sync --project services/market --frozen
      - name: Restore public-source cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime/pages-state
          key: pages-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-state-v1-
      - name: Verify calculations and contracts
        run: |
          npm test
          uv run --project services/market --frozen pytest -q services/market/tests
      - name: Collect public data and publish dated reports
        run: uv run --project services/market --frozen python services/market/export_pages.py
      - name: Build static dashboard
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            export PAGES_BASE_PATH=''
          else
            export PAGES_BASE_PATH="/$REPOSITORY_NAME"
          fi
          npm run build:pages
      - name: Preserve public-source cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime/pages-state
          key: pages-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload website only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/pages/out
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
