# All-Seeing-Eye System Configuration (Paper-First Default)
# Hard risk limits in src/ase/risk.py CANNOT be relaxed by this file or any model.

system:
  name: all-seeing-eye
  mode: paper  # paper | testnet | live (live blocked without explicit approval gate)
  timeframe: 4h
  timezone_storage: UTC
  health_host: 0.0.0.0
  health_port: 8080
  db_path: .runtime/ase.db
  secrets_dir: /etc/ase-secrets

exchange:
  name: binance
  via: ccxt
  testnet_first: true
  markets:
    - spot
    - linear_perps
  short_via_perps_only: true
  fallback_to_paper_if_unreachable: true
  clock_skew_max_ms: 5000
  stale_feed_max_age_sec: 900  # 15 min max staleness for live ticker/orderbook; 4h candle grace checked separately

openmarket:
  enabled: false               # Set true (and provision /etc/ase-secrets/openmarket_token) to route paper/chart via OpenMarket
  workspace_id: "2op55llf"
  mcp_url: "https://mcp.openmarket.xyz/"
  secret_name: "openmarket_token"

account:
  initial_paper_balance_usdt: 10000.0
  quote_currency: USDT

universe:
  off_limits:
    exclude_memecoins: true
    exclude_leveraged_tokens: true
    min_market_cap_usd: 200000000.0
    min_24h_volume_usd: 20000000.0
    blocked_symbols:
      - DOGEUSDT
      - SHIBUSDT
      - PEPEUSDT
      - WIFUSDT
      - BONKUSDT
      - FLOKIUSDT
      - PUMPUSDT
      - AEROUSDT  # Excluded: $100M mcap < $200M floor as of 2026-11-24
    blocked_suffixes:
      - UPUSDT
      - DOWNUSDT
      - BULLUSDT
      - BEARUSDT
      - 3LUSDT
      - 3SUSDT

reflex:
  provider: deterministic  # gemini_hydrogen | deterministic
  model: gemini-4-hydrogen
  thinking_level: low
  max_snapshot_tokens: 400
  daily_budget_usd: 5.0
  # Conservative estimated token pricing for Gemini 4 Hydrogen (labeled estimate until billing API verified)
  est_input_cost_per_1m_usd: 0.30
  est_output_cost_per_1m_usd: 1.20
  request_timeout_sec: 15.0
  skip_on_miss: true
  knowledge_cutoff_utc: "2026-03-31T23:59:59Z"

risk:
  # Hard caps enforced in code (cannot be exceeded even if modified here)
  max_risk_per_trade_pct: 0.01       # 1.0% of equity per trade
  max_daily_loss_pct: 0.05           # 5.0% max daily loss
  max_open_positions: 3              # max 3 concurrent positions
  max_leverage: 2.0                  # hard 2.0x gross leverage cap
  kill_switch_drawdown_pct: 0.15     # 15.0% drawdown -> permanent halt
  min_setup_quality: 2               # trade only if setup_quality >= 2
  min_confidence_to_trade: 0.80      # trade only if confidence > 0.80
  pause_confidence_threshold: 0.60   # pause new risk + Telegram alert if < 0.60
  fixed_min_decision_count: 200      # fixed minimum size for first 200 decisions
  fixed_min_notional_pct: 0.05       # 5% notional (well under 1% stop risk at 5-8% stop)
  max_kelly_fraction: 0.25           # quarter Kelly max after 200 decisions if Brier < baseline
  baseline_brier_score: 0.25         # simple climatology/coin-flip baseline (dynamic base-rate also tracked)

costs:
  spot_taker_fee_bps: 10.0           # 0.10% per side (Binance standard tier estimate)
  perp_taker_fee_bps: 5.0            # 0.05% per side (Binance USDT-M standard tier estimate)
  major_half_spread_bps: 1.0         # BTC/ETH estimate
  major_slippage_bps: 5.0            # BTC/ETH estimate
  alt_half_spread_bps: 3.0           # liquid altcoins estimate
  alt_slippage_bps: 8.0              # liquid altcoins estimate

nightly:
  schedule_utc_hour: 0
  schedule_utc_minute: 15
  max_proposals_per_night: 1
  require_walk_forward_pass: true
  require_paper_gate_pass: true
  auto_push_live: false              # HARD INVARIANT: never silently push a policy live
